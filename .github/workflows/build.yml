name: Release

# v* 태그를 올리면 윈도우 설치 파일을 빌드해 GitHub 릴리스로 올린다.
# 설치된 런처는 이 릴리스의 latest.yml 을 보고 자동 업데이트한다.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci
        shell: bash

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
        shell: bash
